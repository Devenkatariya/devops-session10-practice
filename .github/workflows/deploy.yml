name: CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate version number
        id: version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          VERSION="1.0.${COMMIT_COUNT}-${COMMIT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Generated version: ${VERSION}"

      - name: Install dependencies and run tests
        run: |
          pip install -r requirements.txt pytest || echo "No requirements file"
          python -m pytest tests/ -v || echo "No tests folder yet"

      - name: Package application
        run: |
          mkdir -p dist
          zip -r dist/app-${{ steps.version.outputs.version }}.zip README.md || touch dist/app-${{ steps.version.outputs.version }}.zip
          echo "Package created:"
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 30

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package-${{ needs.build.outputs.version }}

      - name: Simulated Deploy
        run: |
          echo "Simulating deployment of version ${{ needs.build.outputs.version }} to staging S3..."

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package-${{ needs.build.outputs.version }}

      - name: Modern GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --title "Release ${{ needs.build.outputs.version }}" \
            --notes "Deployment Summary for version ${{ needs.build.outputs.version }}"
